[package]
name = "personal-consultant-matrix-mysql-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "LicenseRef-Proprietary"

[features]
integration-tests = ["matrix-sdk-base/testing", "matrix-sdk-crypto/testing"]

[dependencies]
async-trait = "=0.1.89"
matrix-sdk-base = { version = "=0.18.0", default-features = false, features = ["e2e-encryption"] }
matrix-sdk-crypto = { version = "=0.18.0", default-features = false }
matrix-sdk-common = "=0.18.0"
matrix-sdk-store-encryption = "=0.18.0"
ruma = { version = "=0.16.0", features = ["client-api-c"] }
vodozemac = { version = "0.10.0", features = ["libolm-compat"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_bytes = "0.11.17"
rmp-serde = "1.3.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
sha2 = "0.10.9"
hex = "0.4.3"
url = "2.5.8"
thiserror = "2.0.18"
zeroize = "1.8.2"
tokio = { version = "1.49.0", features = ["sync", "time", "macros", "rt-multi-thread"] }
uuid = { version = "1.20.0", features = ["v4"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-native-tls", "mysql"] }
# SQLx's native TLS backend uses this same dependency. Enabling `vendored`
# keeps OpenSSL inside the static musl release instead of depending on the
# GoDaddy host's shared-library versions.
native-tls = { version = "=0.2.18", features = ["vendored"] }

[dev-dependencies]
matrix-sdk-test = "=0.18.0"
assert_matches = "1.5.0"
matrix-sdk-sqlite = { version = "=0.18.0", default-features = false, features = ["bundled", "crypto-store", "state-store"] }
tempfile = "3.24.0"
tokio = { version = "1.49.0", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("experimental-push-secrets", "experimental-encrypted-state-events"))'] }

[lints.clippy]
all = "warn"
