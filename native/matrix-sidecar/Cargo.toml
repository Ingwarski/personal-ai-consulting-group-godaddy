[workspace]
members = ["."]
resolver = "3"

[package]
name = "personal-consultant-matrix-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
fs2 = "0.4.3"
chacha20poly1305 = "0.10.1"
hex = "0.4.3"
matrix-sdk = { version = "=0.18.0", default-features = false, features = ["e2e-encryption", "bundled-sqlite"] }
matrix-sdk-base = { version = "=0.18.0", default-features = false, features = ["e2e-encryption"] }
matrix-sdk-sqlite = { version = "=0.18.0", default-features = false, features = ["bundled", "crypto-store", "state-store"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4"] }
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.24.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
