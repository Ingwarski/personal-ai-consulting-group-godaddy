name: Matrix sidecar immutable production build

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    paths:
      - "native/matrix-sidecar/**"
      - "scripts/*matrix-release*"
      - "test/matrix-release-package.test.mjs"
      - "test/fixtures/matrix-invalid-media.json"
      - ".github/workflows/matrix-sidecar-release.yml"

# No production credentials, package publishing, deployment, or writable token.
permissions:
  contents: read

concurrency:
  group: matrix-production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-node22:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci && npm run check

  build-production-candidate:
    needs: verify-node22
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact workflow/source revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Verify packaging rules before the expensive build
        run: node --test test/matrix-release-package.test.mjs
      - name: Build twice in the immutable musl image, test, compare, and package evidence
        run: node scripts/build-matrix-release.mjs
      - name: Upload the immutable source/run-bound production candidate
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: matrix-production-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/matrix-release/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
          overwrite: false
      - name: Record artifact identity for promotion verification
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          node --input-type=module -e 'console.log(JSON.stringify({artifactId:process.env.ARTIFACT_ID,artifactDigest:process.env.ARTIFACT_DIGEST,commit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,publication:"not performed"}))'
