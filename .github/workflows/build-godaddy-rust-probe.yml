name: Build GoDaddy Rust Matrix probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-musl:
    name: Build static Linux x64 probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust/godaddy-rust-probe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust and musl toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal --target x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes musl-tools binutils
      - name: Resolve locked dependencies and build
        run: |
          if [ ! -f Cargo.lock ]; then cargo +1.93.0 generate-lockfile; fi
          cargo +1.93.0 build --locked --release --target x86_64-unknown-linux-musl
          strip --strip-unneeded target/x86_64-unknown-linux-musl/release/godaddy-rust-probe
      - name: Verify static executable
        run: |
          test -z "$(readelf -l target/x86_64-unknown-linux-musl/release/godaddy-rust-probe | grep 'Requesting program interpreter')"
          docker run --rm --volume "$PWD/target/x86_64-unknown-linux-musl/release:/probe:ro" alpine:3.22 /probe/godaddy-rust-probe self-check
      - name: Package deterministic artifact
        run: |
          mkdir -p out
          cp target/x86_64-unknown-linux-musl/release/godaddy-rust-probe out/godaddy-rust-probe
          cp Cargo.lock out/Cargo.lock
          (cd out && sha256sum godaddy-rust-probe > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godaddy-rust-probe-linux-x64-musl
          path: rust/godaddy-rust-probe/out
          if-no-files-found: error
          retention-days: 1
