name: Matrix sidecar non-deployable verification

on:
  pull_request:
    paths:
      - "native/matrix-sidecar/**"
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "package*.json"
      - "tsconfig.json"
      - ".github/workflows/matrix-sidecar.yml"
  push:
    branches: [main, staging, codex/audit-remediation-20260905]
    paths:
      - "native/matrix-sidecar/**"
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "package*.json"
      - "tsconfig.json"
      - ".github/workflows/matrix-sidecar.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-node22:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use the verified target Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install locked dependencies and verify without credentials
        run: npm ci && npm run check

  verify-build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/matrix-sidecar
        shell: bash
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and musl linker
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-musl
          rustup default 1.93.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils make musl-tools perl

      - name: Verify formatting, lints, and credential-free tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --workspace --locked --all-targets

      - name: Fetch the locked graph and build static release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-musl
          cargo build --release --locked --frozen --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/personal-consultant-matrix-sidecar
          readelf -l target/x86_64-unknown-linux-musl/release/personal-consultant-matrix-sidecar > target/matrix-sidecar.readelf.txt
          if grep -q "INTERP" target/matrix-sidecar.readelf.txt; then
            exit 1
          fi

      - name: Execute credential-free tests on the Linux musl target
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo test --workspace --locked --frozen --all-targets --target x86_64-unknown-linux-musl

      - name: Create checksum, CycloneDX SBOM, and license inventory
        run: |
          mkdir -p dist
          printf '%s\n' 'NON-DEPLOYABLE VERIFICATION EVIDENCE: rebuild in an approved immutable release environment before publication.' > dist/NON_DEPLOYABLE_VERIFICATION_ONLY.txt
          install -m 0755 target/x86_64-unknown-linux-musl/release/personal-consultant-matrix-sidecar dist/personal-consultant-matrix-sidecar
          (cd dist && sha256sum personal-consultant-matrix-sidecar > personal-consultant-matrix-sidecar.sha256)
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cargo install --locked cargo-license --version 0.7.0
          cargo cyclonedx --all --format json --target x86_64-unknown-linux-musl
          mv personal-consultant-matrix-sidecar.cdx.json dist/personal-consultant-matrix-sidecar.cdx.json
          cargo license --json --filter-platform x86_64-unknown-linux-musl > dist/licenses.json

      - name: Upload non-deployable verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NONDEPLOYABLE-matrix-sidecar-linux-x86_64-musl-${{ github.sha }}
          path: native/matrix-sidecar/dist/
          if-no-files-found: error
          retention-days: 7
