[package]
name = "godaddy-rust-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
fs2 = "0.4.3"
matrix-sdk = { version = "=0.18.0", default-features = false, features = ["e2e-encryption", "bundled-sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
